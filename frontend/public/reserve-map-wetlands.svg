<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="swampFloor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4f6440"/>
      <stop offset="100%" stop-color="#334529"/>
    </linearGradient>
    <pattern id="swampGrid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M0,0 H42 M0,0 V42" fill="none" stroke="#6f8459" stroke-width="1"/>
    </pattern>
    <radialGradient id="vignette" cx="50%" cy="46%" r="72%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="78%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0d150a" stop-opacity="0.45"/>
    </radialGradient>
    <radialGradient id="mound" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#63804e"/>
      <stop offset="100%" stop-color="#425a34"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="1200" height="800" fill="url(#swampFloor)"/>
  <rect x="0" y="0" width="1200" height="800" fill="url(#swampGrid)" opacity="0.55"/>

  <!-- boulder cluster, top-left corner -->
  <g fill="#8a8f82">
    <circle cx="60" cy="70" r="30"/>
    <circle cx="105" cy="50" r="22"/>
    <circle cx="45" cy="35" r="16"/>
  </g>
  <g fill="#6f746a" opacity="0.35">
    <circle cx="60" cy="70" r="30"/>
  </g>

  <!-- wooden hut, top-right corner -->
  <g transform="translate(1100,90)">
    <rect x="-30" y="-4" width="60" height="42" fill="#6b4a34" rx="2"/>
    <polygon points="-38,-4 38,-4 0,-42" fill="#3c2a1e"/>
    <rect x="-8" y="14" width="16" height="24" fill="#4a3527"/>
    <rect x="-40" y="10" width="12" height="18" fill="#8a6a4a" opacity="0.85"/>
    <rect x="24" y="10" width="12" height="18" fill="#8a6a4a" opacity="0.85"/>
  </g>

  <!-- central mossy hummock inside the stream loop -->
  <ellipse cx="560" cy="400" rx="115" ry="78" fill="url(#mound)"/>
  <g fill="#334529" opacity="0.4">
    <ellipse cx="560" cy="430" rx="100" ry="30"/>
  </g>
  <g fill="#8a8f82">
    <circle cx="520" cy="390" r="12"/>
    <circle cx="605" cy="410" r="9"/>
  </g>
  <g fill="#dcc23f">
    <circle cx="545" cy="365" r="4"/>
    <circle cx="590" cy="378" r="3.5"/>
  </g>
  <g fill="#c2452f">
    <circle cx="575" cy="440" r="4.5"/>
  </g>

  <!-- winding stream loop around the central mound -->
  <path d="M40,400 C160,340 220,420 300,440 C400,464 460,420 470,350 C480,270 400,240 340,270
           C290,294 290,360 350,388 C420,420 520,470 620,460 C710,452 760,390 730,320
           C700,250 610,240 560,280 C620,300 660,360 630,420 C600,480 500,520 420,560
           C330,606 240,614 150,660 C100,684 70,712 40,750"
        fill="none" stroke="#6f8478" stroke-width="30" stroke-linecap="round" stroke-linejoin="round" opacity="0.92"/>
  <path d="M40,400 C160,340 220,420 300,440 C400,464 460,420 470,350 C480,270 400,240 340,270
           C290,294 290,360 350,388 C420,420 520,470 620,460 C710,452 760,390 730,320
           C700,250 610,240 560,280 C620,300 660,360 630,420 C600,480 500,520 420,560
           C330,606 240,614 150,660 C100,684 70,712 40,750"
        fill="none" stroke="#a2bcaf" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>

  <!-- pebble clusters along the stream -->
  <g fill="#8a8f82">
    <circle cx="250" cy="430" r="10"/>
    <circle cx="265" cy="442" r="6"/>
    <circle cx="700" cy="340" r="9"/>
    <circle cx="235" cy="630" r="10"/>
    <circle cx="250" cy="642" r="6"/>
  </g>

  <!-- lily pads along the stream -->
  <g id="lilypad">
    <ellipse cx="0" cy="0" rx="17" ry="10" fill="#4f7a48"/>
    <ellipse cx="0" cy="0" rx="17" ry="10" fill="none" stroke="#37552f" stroke-width="2"/>
    <path d="M0,0 L17,0" stroke="#37552f" stroke-width="1.5"/>
  </g>
  <use href="#lilypad" x="110" y="370"/>
  <use href="#lilypad" x="410" y="330" transform="rotate(30 410 330)"/>
  <use href="#lilypad" x="680" y="410" transform="rotate(-20 680 410)"/>
  <use href="#lilypad" x="540" y="540" transform="rotate(15 540 540)"/>
  <use href="#lilypad" x="200" y="590" transform="rotate(-35 200 590)"/>

  <!-- moss bushes framing the edges -->
  <g id="mossBush">
    <ellipse cx="0" cy="6" rx="30" ry="14" fill="#243119" opacity="0.4"/>
    <circle cx="-12" cy="-6" r="19" fill="#5c7a4a"/>
    <circle cx="12" cy="-9" r="21" fill="#527049"/>
    <circle cx="0" cy="-16" r="16" fill="#688a54"/>
  </g>
  <use href="#mossBush" x="150" y="150"/>
  <use href="#mossBush" x="330" y="110" transform="rotate(10 330 110)"/>
  <use href="#mossBush" x="960" y="200" transform="scale(0.9)"/>
  <use href="#mossBush" x="1080" y="330" transform="rotate(-8 1080 330)"/>
  <use href="#mossBush" x="1120" y="560" transform="scale(1.05)"/>
  <use href="#mossBush" x="960" y="680"/>
  <use href="#mossBush" x="700" y="720" transform="rotate(6 700 720)"/>
  <use href="#mossBush" x="430" y="700" transform="scale(0.9)"/>
  <use href="#mossBush" x="150" y="740"/>
  <use href="#mossBush" x="70" y="560" transform="scale(0.85)"/>
  <use href="#mossBush" x="80" y="230" transform="scale(0.85)"/>

  <!-- tiny mushroom / flower accents -->
  <g fill="#c2452f">
    <circle cx="850" cy="470" r="6"/>
    <circle cx="300" cy="200" r="5"/>
  </g>
  <g fill="#f0f0e8">
    <circle cx="848" cy="468" r="1.4"/>
    <circle cx="852" cy="471" r="1.2"/>
    <circle cx="298" cy="198" r="1.2"/>
  </g>
  <g fill="#d9c04a">
    <circle cx="900" cy="600" r="5"/>
    <circle cx="180" cy="450" r="4"/>
    <circle cx="780" cy="250" r="4"/>
  </g>

  <rect x="0" y="0" width="1200" height="800" fill="url(#vignette)"/>
  <rect x="0" y="0" width="1200" height="800" fill="none" stroke="#20301a" stroke-width="6"/>
</svg>

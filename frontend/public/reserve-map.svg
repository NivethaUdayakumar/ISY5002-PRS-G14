<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eef1e2"/>
      <stop offset="100%" stop-color="#e2e8d2"/>
    </linearGradient>
    <linearGradient id="swampFloor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4c5e3c"/>
      <stop offset="100%" stop-color="#33452a"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#cdf0e6"/>
      <stop offset="40%" stop-color="#5cc4c9"/>
      <stop offset="100%" stop-color="#1f93a6"/>
    </linearGradient>
    <radialGradient id="pond" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#d8f5ec"/>
      <stop offset="100%" stop-color="#3fadb8"/>
    </radialGradient>
    <linearGradient id="heath" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ded2a8"/>
      <stop offset="100%" stop-color="#cdb97f"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="30%" cy="15%" r="70%">
      <stop offset="0%" stop-color="#fff8e0" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#fff8e0" stop-opacity="0"/>
    </radialGradient>
    <pattern id="swampGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M0,0 H40 M0,0 V40" fill="none" stroke="#6b7f57" stroke-width="1"/>
    </pattern>
    <clipPath id="swampClip">
      <path d="M0,0 L470,0 C450,140 400,220 340,300 C270,392 200,440 120,500 C70,536 30,560 0,580 Z"/>
    </clipPath>
  </defs>

  <rect x="0" y="0" width="1200" height="800" fill="url(#ground)"/>
  <rect x="0" y="0" width="1200" height="800" fill="url(#sunGlow)"/>

  <!-- ============ LAGOON (bottom-right, tropical shore) ============ -->
  <path d="M1200,800 L620,800 C660,700 700,660 760,610 C840,545 940,500 1060,450 C1110,428 1160,410 1200,398 Z" fill="#ecdfb2"/>
  <path d="M1200,800 L660,800 C700,706 745,668 805,618 C880,556 970,512 1080,466 C1125,447 1165,432 1200,420 Z" fill="url(#water)"/>

  <!-- foam wave lines along the shoreline -->
  <g stroke="#ffffff" stroke-width="3" opacity="0.65" fill="none" stroke-linecap="round">
    <path d="M700,706 C750,684 800,672 850,646"/>
    <path d="M745,668 C800,644 855,628 915,596"/>
    <path d="M805,618 C860,592 915,576 975,546"/>
    <path d="M880,556 C935,530 985,516 1040,490"/>
    <path d="M970,512 C1020,488 1065,474 1115,450"/>
  </g>
  <g stroke="#eaf7f4" stroke-width="6" opacity="0.35" fill="none" stroke-linecap="round">
    <path d="M760,740 C820,708 870,690 930,656"/>
    <path d="M900,600 C950,576 995,558 1045,528"/>
  </g>

  <!-- small hidden pond ringed by palms, bottom-right corner -->
  <ellipse cx="1130" cy="700" rx="60" ry="46" fill="url(#pond)"/>
  <ellipse cx="1130" cy="700" rx="60" ry="46" fill="none" stroke="#eadfb0" stroke-width="10" opacity="0.5"/>

  <!-- reef / sandbar flecks -->
  <g fill="#cdbf8f" opacity="0.8">
    <ellipse cx="705" cy="742" rx="16" ry="6"/>
    <ellipse cx="1040" cy="360" rx="18" ry="6"/>
  </g>
  <g fill="#5c7d4f" opacity="0.85">
    <ellipse cx="700" cy="737" rx="6" ry="4"/>
    <ellipse cx="1034" cy="356" rx="6" ry="4"/>
  </g>

  <!-- palm trees scattered along the shore -->
  <g id="palms">
    <g transform="translate(700,640)">
      <path d="M0,0 C-4,-18 2,-34 0,-48" fill="none" stroke="#7a5230" stroke-width="6" stroke-linecap="round"/>
      <g fill="#3f7d4a">
        <ellipse cx="0" cy="-50" rx="26" ry="9" transform="rotate(-10 0 -50)"/>
        <ellipse cx="0" cy="-50" rx="26" ry="9" transform="rotate(35 0 -50)"/>
        <ellipse cx="0" cy="-50" rx="26" ry="9" transform="rotate(80 0 -50)"/>
        <ellipse cx="0" cy="-50" rx="24" ry="8" transform="rotate(-55 0 -50)"/>
        <ellipse cx="0" cy="-50" rx="22" ry="8" transform="rotate(125 0 -50)"/>
      </g>
    </g>
    <g transform="translate(1150,560) scale(0.9)">
      <path d="M0,0 C4,-18 -2,-34 0,-48" fill="none" stroke="#7a5230" stroke-width="6" stroke-linecap="round"/>
      <g fill="#438453">
        <ellipse cx="0" cy="-50" rx="26" ry="9" transform="rotate(-10 0 -50)"/>
        <ellipse cx="0" cy="-50" rx="26" ry="9" transform="rotate(35 0 -50)"/>
        <ellipse cx="0" cy="-50" rx="26" ry="9" transform="rotate(80 0 -50)"/>
        <ellipse cx="0" cy="-50" rx="24" ry="8" transform="rotate(-55 0 -50)"/>
      </g>
    </g>
    <g transform="translate(1080,690) scale(0.8)">
      <path d="M0,0 C-4,-18 2,-34 0,-48" fill="none" stroke="#7a5230" stroke-width="6" stroke-linecap="round"/>
      <g fill="#3f7d4a">
        <ellipse cx="0" cy="-50" rx="26" ry="9" transform="rotate(-10 0 -50)"/>
        <ellipse cx="0" cy="-50" rx="26" ry="9" transform="rotate(35 0 -50)"/>
        <ellipse cx="0" cy="-50" rx="26" ry="9" transform="rotate(80 0 -50)"/>
        <ellipse cx="0" cy="-50" rx="24" ry="8" transform="rotate(-55 0 -50)"/>
      </g>
    </g>
    <g transform="translate(1185,680) scale(0.75)">
      <path d="M0,0 C4,-18 -2,-34 0,-48" fill="none" stroke="#7a5230" stroke-width="6" stroke-linecap="round"/>
      <g fill="#438453">
        <ellipse cx="0" cy="-50" rx="24" ry="8" transform="rotate(-10 0 -50)"/>
        <ellipse cx="0" cy="-50" rx="24" ry="8" transform="rotate(40 0 -50)"/>
        <ellipse cx="0" cy="-50" rx="22" ry="8" transform="rotate(90 0 -50)"/>
      </g>
    </g>
  </g>

  <!-- orange flower clusters -->
  <g id="flowerClusterA" transform="translate(1035,300)">
    <g fill="#e8862f">
      <ellipse cx="-14" cy="-4" rx="7" ry="5"/>
      <ellipse cx="0" cy="-10" rx="7" ry="5"/>
      <ellipse cx="14" cy="-2" rx="7" ry="5"/>
      <ellipse cx="-6" cy="8" rx="7" ry="5"/>
      <ellipse cx="10" cy="10" rx="7" ry="5"/>
      <ellipse cx="26" cy="-6" rx="6" ry="4"/>
      <ellipse cx="-22" cy="10" rx="6" ry="4"/>
    </g>
    <g fill="#f4a94a">
      <circle cx="-14" cy="-4" r="2"/>
      <circle cx="0" cy="-10" r="2"/>
      <circle cx="14" cy="-2" r="2"/>
      <circle cx="-6" cy="8" r="2"/>
      <circle cx="10" cy="10" r="2"/>
    </g>
  </g>
  <g id="flowerClusterB" transform="translate(715,700) scale(0.85)">
    <g fill="#e8862f">
      <ellipse cx="-14" cy="-4" rx="7" ry="5"/>
      <ellipse cx="0" cy="-10" rx="7" ry="5"/>
      <ellipse cx="14" cy="-2" rx="7" ry="5"/>
      <ellipse cx="-6" cy="8" rx="7" ry="5"/>
      <ellipse cx="10" cy="10" rx="7" ry="5"/>
    </g>
    <g fill="#f4a94a">
      <circle cx="-14" cy="-4" r="2"/>
      <circle cx="0" cy="-10" r="2"/>
      <circle cx="14" cy="-2" r="2"/>
      <circle cx="-6" cy="8" r="2"/>
      <circle cx="10" cy="10" r="2"/>
    </g>
  </g>

  <!-- ============ HEATHLAND (top-right) ============ -->
  <path d="M1200,0 L560,0 C610,90 700,120 800,150 C930,188 1080,210 1200,224 Z" fill="url(#heath)"/>
  <g fill="#b7924f" opacity="0.55">
    <circle cx="700" cy="55" r="5"/>
    <circle cx="745" cy="95" r="4"/>
    <circle cx="805" cy="50" r="6"/>
    <circle cx="855" cy="115" r="4"/>
    <circle cx="925" cy="80" r="5"/>
    <circle cx="985" cy="140" r="4"/>
    <circle cx="1045" cy="90" r="5"/>
    <circle cx="1100" cy="150" r="4"/>
    <circle cx="640" cy="80" r="4"/>
  </g>
  <g fill="#8a9a4a" opacity="0.65">
    <ellipse cx="680" cy="70" rx="10" ry="5" transform="rotate(-15 680 70)"/>
    <ellipse cx="770" cy="60" rx="9" ry="5" transform="rotate(10 770 60)"/>
    <ellipse cx="880" cy="100" rx="10" ry="5" transform="rotate(-8 880 100)"/>
    <ellipse cx="960" cy="70" rx="9" ry="5" transform="rotate(12 960 70)"/>
    <ellipse cx="1030" cy="130" rx="10" ry="5" transform="rotate(-10 1030 130)"/>
    <ellipse cx="1110" cy="95" rx="9" ry="5" transform="rotate(6 1110 95)"/>
  </g>

  <!-- ============ RIVER connecting swamp to lagoon ============ -->
  <path d="M120,120 C220,220 260,320 320,390 C400,480 480,520 560,560 C650,606 700,650 700,730"
        fill="none" stroke="#7c9088" stroke-width="24" stroke-linecap="round" opacity="0.85"/>
  <path d="M120,120 C220,220 260,320 320,390 C400,480 480,520 560,560 C650,606 700,650 700,730"
        fill="none" stroke="#a9c2b8" stroke-width="9" stroke-linecap="round" opacity="0.7"/>

  <!-- ============ WETLANDS (left / mossy swamp, grid battle-map style) ============ -->
  <path d="M0,0 L470,0 C450,140 400,220 340,300 C270,392 200,440 120,500 C70,536 30,560 0,580 Z" fill="url(#swampFloor)"/>
  <rect x="0" y="0" width="470" height="580" fill="url(#swampGrid)" clip-path="url(#swampClip)" opacity="0.55"/>

  <!-- boulder cluster, top-left -->
  <g fill="#8a8f82">
    <circle cx="40" cy="50" r="22"/>
    <circle cx="70" cy="35" r="16"/>
    <circle cx="30" cy="25" r="12"/>
  </g>
  <g fill="#6f746a">
    <circle cx="40" cy="50" r="22" opacity="0.3"/>
  </g>

  <!-- wooden hut, top-left -->
  <g transform="translate(370,55)">
    <rect x="-24" y="-4" width="48" height="34" fill="#6b4a34" rx="2"/>
    <polygon points="-30,-4 30,-4 0,-34" fill="#3c2a1e"/>
    <rect x="-6" y="10" width="12" height="20" fill="#4a3527"/>
    <rect x="-32" y="8" width="10" height="14" fill="#8a6a4a" opacity="0.85"/>
  </g>

  <!-- winding stream with lily pads and stones -->
  <path d="M20,480 C90,440 110,500 90,540 C70,580 140,600 200,560 C260,522 220,470 280,450 C320,436 360,450 380,420"
        fill="none" stroke="#6f8478" stroke-width="26" stroke-linecap="round" opacity="0.9"/>
  <path d="M20,480 C90,440 110,500 90,540 C70,580 140,600 200,560 C260,522 220,470 280,450 C320,436 360,450 380,420"
        fill="none" stroke="#9db6ab" stroke-width="9" stroke-linecap="round" opacity="0.7"/>

  <g fill="#8a8f82">
    <circle cx="150" cy="518" r="10"/>
    <circle cx="165" cy="528" r="6"/>
    <circle cx="230" cy="545" r="9"/>
    <circle cx="300" cy="440" r="8"/>
    <circle cx="312" cy="450" r="5"/>
  </g>

  <g id="lilypad">
    <ellipse cx="0" cy="0" rx="15" ry="9" fill="#4f7a48"/>
    <ellipse cx="0" cy="0" rx="15" ry="9" fill="none" stroke="#37552f" stroke-width="2"/>
    <path d="M0,0 L15,0" stroke="#37552f" stroke-width="1.5"/>
  </g>
  <use href="#lilypad" x="70" y="470"/>
  <use href="#lilypad" x="120" y="560" transform="rotate(20 120 560)"/>
  <use href="#lilypad" x="250" y="500" transform="rotate(-15 250 500)"/>
  <use href="#lilypad" x="350" y="430" transform="rotate(35 350 430)"/>

  <!-- moss bushes -->
  <g id="mossBush">
    <ellipse cx="0" cy="4" rx="26" ry="12" fill="#2c3a22" opacity="0.4"/>
    <circle cx="-10" cy="-6" r="16" fill="#5c7a4a"/>
    <circle cx="10" cy="-8" r="18" fill="#527049"/>
    <circle cx="0" cy="-14" r="14" fill="#688a54"/>
  </g>
  <use href="#mossBush" x="130" y="140"/>
  <use href="#mossBush" x="260" y="200" transform="rotate(8 260 200)"/>
  <use href="#mossBush" x="200" y="330" transform="rotate(-6 200 330)"/>
  <use href="#mossBush" x="90" y="330"/>
  <use href="#mossBush" x="340" y="300" transform="scale(0.85)"/>
  <use href="#mossBush" x="150" y="440" transform="scale(0.8)"/>

  <!-- tiny mushroom / flower accents -->
  <g fill="#c2452f">
    <circle cx="245" cy="620" r="6"/>
    <circle cx="180" cy="650" r="5"/>
  </g>
  <g fill="#f0f0e8">
    <circle cx="243" cy="618" r="1.4"/>
    <circle cx="247" cy="621" r="1.2"/>
    <circle cx="178" cy="648" r="1.2"/>
  </g>
  <g fill="#d9c04a">
    <circle cx="330" cy="560" r="5"/>
    <circle cx="60" cy="220" r="4"/>
  </g>

  <!-- ============ TRANSITION GRASSLAND (center, around North Wall) ============ -->
  <g stroke="#b7c79f" stroke-width="2" opacity="0.5">
    <path d="M420,540 C470,530 520,530 570,548"/>
    <path d="M430,565 C480,555 530,555 580,573"/>
  </g>
  <!-- boundary wall -->
  <path d="M380,470 C450,500 520,520 610,540" fill="none" stroke="#9a9186" stroke-width="6" stroke-dasharray="14 6" opacity="0.6" stroke-linecap="round"/>

  <!-- ============ CONTOUR LINES (topography, whole map) ============ -->
  <g fill="none" stroke="#c3cdb4" stroke-width="1.5" opacity="0.4">
    <path d="M480,560 C560,540 620,590 700,570 C820,540 900,590 1000,560"/>
    <path d="M500,610 C580,590 640,640 720,620 C840,590 920,640 1020,610"/>
    <path d="M520,660 C600,640 660,690 740,670 C860,640 940,690 1040,660"/>
  </g>

  <!-- ============ MAIN DASHED TRAIL ============ -->
  <path d="M100,150 C260,260 320,380 420,460 C540,550 640,600 760,560 C860,530 940,420 1080,340"
        fill="none" stroke="#8a8f7c" stroke-width="2.5" stroke-dasharray="2 10" stroke-linecap="round" opacity="0.6"/>

  <!-- soft vignette border -->
  <rect x="0" y="0" width="1200" height="800" fill="none" stroke="#d8d4c4" stroke-width="4"/>
</svg>
